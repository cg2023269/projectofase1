<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiv FA - Página Principal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        header img {
            height: 50px;
            vertical-align: middle;
        }
        header h1 {
            display: inline;
            margin-left: 10px;
            font-size: 24px;
        }
        nav {
            display: flex;
            justify-content: flex-end;
            background-color: #34495e;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #2c3e50;
        }
        nav a:hover {
            background-color: #1abc9c;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #1abc9c;
            color: white;
            cursor: pointer;
        }
        .buttons button:hover {
            background-color: #16a085;
        }
        .results {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }
        .results div {
            flex: 1;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .results div p {
            margin: 5px 0;
        }
        .results canvas {
            max-width: 120px;
            margin: auto;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 8px;
        }
        .info-item span {
            font-weight: bold;
        }
        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .records-table th, .records-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .records-table th {
            background-color: #2c3e50;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Antiv FA Logo">
        <h1>Antiv FA</h1>
    </header>
    <nav>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="registros.html">Registros</a>
    </nav>
    <div class="container">
        <div class="section">
            <h2>Registros</h2>
            <table class="records-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Archivo</th>
                        <th>Usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>archivo1.exe</td>
                        <td>Ejecutable</td>
                        <td>Juan Pérez</td>
                        <td>
                            <button>Eliminar</button>
                            <button>Descargar</button>
                        </td>
                    </tr>
                    <tr>
                        <td>documento.pdf</td>
                        <td>PDF</td>
                        <td>María Lopez</td>
                        <td>
                            <button>Eliminar</button>
                            <button>Descargar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="section">
            <div class="buttons">
                <input type="file" id="fileInput" style="display:none;">
                <button id="uploadButton">Examinar</button>
                <button id="submitButton">Subir</button>
