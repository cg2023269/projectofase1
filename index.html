<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiv FA - Página Principal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        header img {
            height: 50px;
            vertical-align: middle;
        }
        header h1 {
            display: inline;
            margin-left: 10px;
            font-size: 24px;
        }
        nav {
            display: flex;
            justify-content: flex-end;
            background-color: #34495e;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            background-color: #2c3e50;
        }
        nav a:hover {
            background-color: #1abc9c;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .results div {
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .results p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Antiv FA Logo">
        <h1>Antiv FA</h1>
    </header>
    <nav>
        <a href="login/login.html">Login</a>
        <a href="login/signup.html">Sign Up</a>
        <a href="login/registros.html">Registros</a>
    </nav>
    <div class="container">
        <div class="section">
            <h2>Subir y Analizar Archivos</h2>
            <form action="#" method="post" enctype="multipart/form-data">
                <label for="file">Seleccione un archivo:</label>
                <input type="file" id="file" name="file" required>
                <button type="submit">Subir y analizar</button>
            </form>
        </div>
        <div class="section">
            <h2>Resultados</h2>
            <div class="results">
                <div>
                    <p><strong>Nombre del archivo:</strong> --</p>
                    <p><strong>Hash (SHA256):</strong> --</p>
                    <p><strong>Estado:</strong> --</p>
                    <p><strong>Ubicación:</strong> --</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const resultsDiv = document.querySelector('.results div');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const fileInput = document.getElementById('file');
                const file = fileInput.files[0];

                if (!file) {
                    alert('Por favor, seleccione un archivo.');
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const response = await fetch('/cgi-bin/check_file.py', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Error: ${response.statusText}`);
                    }

                    const data = await response.json();

                    if (data.error) {
                        resultsDiv.innerHTML = `<p><strong>Error:</strong> ${data.error}</p>`;
                    } else {
                        resultsDiv.innerHTML = `
                            <p><strong>Nombre del archivo:</strong> ${data.file_name}</p>
                            <p><strong>Hash (SHA256):</strong> ${data.hash}</p>
                            <p><strong>Estado:</strong> ${data.status === 'infected' ? 'Malicioso' : 'Limpio'}</p>
                            <p><strong>Ubicación:</strong> ${data.location}</p>
                        `;
                    }
                } catch (error) {
                    resultsDiv.innerHTML = `<p><strong>Error:</strong> ${error.message}</p>`;
                }
            });
        });
    </script>
</body>
</html>
